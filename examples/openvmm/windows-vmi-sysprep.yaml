apiVersion: v1
kind: Secret
metadata:
  name: cloudbuild-unattend-datavolume-sysprep
type: Opaque
stringData:
  # KubeVirt requires this exact lowercase filename on sysprep media. This
  # install-time answer file is intentionally empty for a generalized image.
  autounattend.xml: |-
    <?xml version="1.0" encoding="utf-8"?>
    <unattend xmlns="urn:schemas-microsoft-com:unattend" />

  # Windows uses unattend.xml while completing OOBE on a generalized image.
  # Keep both password values identical after replacing the example value.
  unattend.xml: |-
    <?xml version="1.0" encoding="utf-8"?>
    <unattend xmlns="urn:schemas-microsoft-com:unattend">
      <settings pass="oobeSystem">
        <component name="Microsoft-Windows-International-Core"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35"
                   language="neutral"
                   versionScope="nonSxS"
                   xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <InputLocale>en-US</InputLocale>
          <SystemLocale>en-US</SystemLocale>
          <UILanguage>en-US</UILanguage>
          <UserLocale>en-US</UserLocale>
        </component>
        <component name="Microsoft-Windows-Shell-Setup"
                   processorArchitecture="amd64"
                   publicKeyToken="31bf3856ad364e35"
                   language="neutral"
                   versionScope="nonSxS"
                   xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
          <OOBE>
            <HideEULAPage>true</HideEULAPage>
            <HideLocalAccountScreen>true</HideLocalAccountScreen>
            <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
            <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
            <NetworkLocation>Work</NetworkLocation>
            <ProtectYourPC>3</ProtectYourPC>
          </OOBE>
          <UserAccounts>
            <LocalAccounts>
              <LocalAccount wcm:action="add">
                <Name>imageadmin</Name>
                <DisplayName>Image Administrator</DisplayName>
                <Description>First-boot image customization administrator</Description>
                <Group>Administrators</Group>
                <Password>
                  <Value>P@ssw0rd!!</Value>
                  <PlainText>true</PlainText>
                </Password>
              </LocalAccount>
            </LocalAccounts>
          </UserAccounts>
        </component>
      </settings>
    </unattend>

---
apiVersion: kubevirt.io/v1
kind: VirtualMachineInstance
metadata:
  name: cloudbuild00
spec:
  architecture: amd64
  domain:
    cpu:
      cores: 4
      model: host-model
    devices:
      disks:
      - name: sysprep
        cdrom:
          bus: vmbus
          readonly: true
      - disk:
          bus: vmbus
        name: rootdisk
      interfaces:
      - bridge: {}
        model: vmbus
        name: default
    features:
      acpi:
        enabled: true
    firmware:
      bootloader:
        efi:
          secureBoot: false
    memory:
      guest: 4Gi
  evictionStrategy: None
  networks:
  - name: default
    pod: {}
  volumes:
  - name: sysprep
    sysprep:
      secret:
        name: cloudbuild-unattend-datavolume-sysprep
  - name: rootdisk
    persistentVolumeClaim:
      claimName: local-vhd-pvc
